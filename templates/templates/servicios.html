{% extends 'template_base.html' %}

{% block content %}
<section class="container py-5">
  <div class="row g-4">
    {% for item in servicios %}
    <div class="col-md-6 col-lg-3">
      <div class="card tn-card p-3 position-relative">
        <div class="tn-icon">{{ item.icono }}</div>
        <h5 class="card-title">{{ item.nombre }}</h5>
        <p class="card-text text-muted">{{ item.resumen }}</p>
        <a href="{% url 'detalle' servicio_id=item.id %}" class="stretched-link fw-semibold">Ver detalle &rarr;</a>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
